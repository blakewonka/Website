<!doctype html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
  // GitHub Pages SPA fallback: send /crediinsight/<route> to /crediinsight/?/<route>
  var l = window.location;
  if (l.pathname.indexOf('/crediinsight/') === 0) {
    var path = l.pathname.slice('/crediinsight/'.length);
    l.replace(l.origin + '/crediinsight/?/' + path.replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
  } else { l.replace('/'); }
</script></head><body></body></html>
