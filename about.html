<style>
:root{--bg:#f7f7f7;--fg:#1b1b1b;--muted:rgba(27,27,27,.75);--hover:rgba(27,27,27,.03);--press:rgba(27,27,27,.06);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#131313;--fg:#f7f7f7;--muted:rgba(247,247,247,.75);--hover:rgba(247,247,247,.03);--press:rgba(247,247,247,.06);color-scheme:dark}}
*{margin:0;box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{background:var(--bg);color:var(--muted);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;letter-spacing:-.24px;padding:120px 20px;display:flex;justify-content:center;min-height:100vh}
main{max-width:780px;width:100%;display:flex;flex-direction:column;gap:120px}
h1{font-size:20px;font-weight:500;letter-spacing:-.3px;color:var(--fg)}
p{font-weight:400}
strong,h2{font-weight:500;color:var(--fg)}
h2{font-size:16px}
section{display:flex;flex-direction:column;gap:24px}
.proj{display:flex;flex-direction:column;border-radius:16px;padding:8px 12px;margin:-8px -12px}
.proj p{color:var(--muted)}
a.proj{color:inherit;text-decoration:none;transition:background-color .15s,transform .05s}
a.proj:hover{background:var(--hover)}
a.proj:active{background:var(--press);transform:scale(.98)}
a{color:inherit;text-decoration:underline;text-decoration-skip-ink:none;text-underline-position:from-font}
.chip{border-radius:6px;padding:2px 4px;margin:-2px -4px;transition:background-color .15s}
.chip:hover{background:var(--hover)}
.chip:active{background:var(--press)}
a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
</style>
